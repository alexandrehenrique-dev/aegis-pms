spring:
  application:
    name: aegis-pms-backend

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8282/realms/aegis}

  datasource:
    url: jdbc:postgresql://${AEGIS_DB_HOST:localhost}:${AEGIS_DB_PORT:5434}/${AEGIS_DB_NAME:aegis_pms}
    username: ${AEGIS_DB_USER:aegis_user}
    password: ${AEGIS_DB_PASSWORD:aegis_password}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          ssl:
            enable: ${SMTP_SSL:false}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    baseline-on-migrate: false

  servlet:
    multipart:
      # Tabela de limites por categoria (aegis.assets.limits abaixo) — o maior limite
      # individual hoje e a categoria "video" (250MB, ver 12_dominio_assets.md Secao C).
      # Estes dois valores precisam ficar acima do maior limite de categoria, senao o
      # upload falha com 413 no parser do multipart antes mesmo de chegar no AssetService.
      max-file-size: ${AEGIS_ASSETS_MULTIPART_MAX_FILE_SIZE:260MB}
      max-request-size: ${AEGIS_ASSETS_MULTIPART_MAX_REQUEST_SIZE:260MB}

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8282/realms/aegis}
  internal-base-url: ${KEYCLOAK_INTERNAL_BASE_URL:http://localhost:8282}
  admin-realms-path: ${KEYCLOAK_ADMIN_REALMS_PATH:/admin/realms/}
  realm: ${KEYCLOAK_REALM:aegis}
  web-client-id: ${KEYCLOAK_WEB_CLIENT_ID:aegis-web}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
  admin-username: ${KEYCLOAK_ADMIN:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false


aegis:
  app:
    base-url: ${AEGIS_APP_BASE_URL:http://localhost:8080}
  email:
    from: ${SMTP_FROM:noreply@aegis.app}
    product-template-path: ${AEGIS_PRODUCT_EMAIL_TEMPLATE_PATH:../infra/keycloak/themes/aegis/email/html}
  storage:
    local-path: ${AEGIS_STORAGE_LOCAL_PATH:./data/assets}
    s3:
      bucket: ${AEGIS_STORAGE_S3_BUCKET:}
      region: ${AEGIS_STORAGE_S3_REGION:}
      access-key-id: ${AEGIS_STORAGE_S3_ACCESS_KEY_ID:}
      secret-access-key: ${AEGIS_STORAGE_S3_SECRET_ACCESS_KEY:}
      presigned-url-ttl-seconds: ${AEGIS_STORAGE_S3_PRESIGNED_URL_TTL_SECONDS:900}
  telegram:
    alert:
      enabled: ${AEGIS_TELEGRAM_ALERT_ENABLED:false}
      chat-id: ${AEGIS_TELEGRAM_ALERT_CHAT_ID:}
      bot-token: ${AEGIS_TELEGRAM_ALERT_BOT_TOKEN:}

  # Tabela de mime types aceitos e limite de tamanho por categoria de asset (etapa 12,
  # Secao C) — configuravel aqui, nunca hardcoded no codigo.
  assets:
    limits:
      image:
        mime-types:
          - image/jpeg
          - image/png
          - image/webp
          - image/svg+xml
        max-size-bytes: 5242880
      pdf:
        mime-types:
          - application/pdf
        max-size-bytes: 15728640
      audio:
        mime-types:
          - audio/mpeg
          - audio/wav
          - audio/ogg
        max-size-bytes: 31457280
      video:
        mime-types:
          - video/mp4
          - video/webm
          - video/quicktime
        max-size-bytes: 262144000
      document:
        mime-types:
          - application/msword
          - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          - application/vnd.ms-excel
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - text/csv
        max-size-bytes: 15728640

logging:
  level:
    br.com.byop.aegis: INFO
    br.com.byop.aegis.security: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
