spring:
  application:
    name: aegis-pms-backend

  datasource:
    url: jdbc:postgresql://${AEGIS_DB_HOST:localhost}:${AEGIS_DB_PORT:5434}/${AEGIS_DB_NAME:aegis_pms}
    username: ${AEGIS_DB_USER:aegis_user}
    password: ${AEGIS_DB_PASSWORD:aegis_password}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true


aegis:
  storage:
    local-path: ${AEGIS_STORAGE_LOCAL_PATH:./data/assets}
