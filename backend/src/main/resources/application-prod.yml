spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

aegis:
  app:
    base-url: ${AEGIS_APP_BASE_URL:https://aegis.byop.dev}
    cors-allowed-origins:
      - "https://aegis.byop.dev"
  seed:
    demo-user-initial-credential: ""

logging:
  level:
    br.com.byop.aegis: INFO
    br.com.byop.aegis.security: WARN
    org.springframework: WARN
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%level","logger":"%logger","message":"%message"}%n'
