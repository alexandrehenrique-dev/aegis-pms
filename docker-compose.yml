services:
  aegis-postgres:
    image: postgres:16
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AEGIS_DB_NAME}
      POSTGRES_USER: ${AEGIS_DB_USER}
      POSTGRES_PASSWORD: ${AEGIS_DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${AEGIS_DB_PORT}:5432"
    volumes:
      - aegis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AEGIS_DB_USER} -d ${AEGIS_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  keycloak-postgres:
    image: postgres:16
    container_name: keycloak-postgres-aegis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${KEYCLOAK_DB_PORT}:5432"
    volumes:
      - keycloak_aegis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER} -d ${KEYCLOAK_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: aegis-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "${KEYCLOAK_HTTP_PORT}:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    networks:
      - aegis-network

volumes:
  aegis_postgres_data:
  keycloak_aegis_postgres_data:

networks:
  aegis-network: