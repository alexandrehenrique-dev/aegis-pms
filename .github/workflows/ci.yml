name: CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

env:
  IMAGE_NAME: aegis-pms

jobs:
  frontend-check:
    name: Frontend - typecheck + lint
    runs-on: [self-hosted, genesis-lab]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  backend-verify:
    name: Backend - Maven verify
    runs-on: [self-hosted, genesis-lab]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Verify
        working-directory: backend
        run: mvn -B clean verify

  docker-build:
    name: Docker - build image
    runs-on: [self-hosted, genesis-lab]
    needs:
      - frontend-check
      - backend-verify
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f backend/Dockerfile .

  bruno-tests:
    name: Bruno - local stack smoke
    runs-on: [self-hosted, genesis-lab]
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - name: Start local stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs aegis-backend
          exit 1

      # PRÉ-LIMPEZA: apagar resíduos de runs anteriores que falharam antes do teardown
      - name: Pre-test teardown (limpar resíduos anteriores)
        working-directory: bruno
        run: npx @usebruno/cli run 99-teardown --env local -r --sandbox developer
        continue-on-error: true # não bloquear se já está limpo

      # SUITE PRINCIPAL: --sandbox developer é obrigatório para que o teardown
      # embutido no 99-teardown (que usa fetch() no post-response script)
      # funcione — o sandbox default "safe" (QuickJS) não tem fetch, então o
      # teardown roda sem erro aparente mas não apaga nada (G.1).
      - name: Run Bruno collection
        working-directory: bruno
        run: npx @usebruno/cli run --env local --sandbox developer

      # PÓS-LIMPEZA: garantir limpeza mesmo que a suite falhe no meio
      - name: Post-test teardown (garantir limpeza após suite)
        if: always()
        working-directory: bruno
        run: npx @usebruno/cli run 99-teardown --env local -r --sandbox developer

      - name: Stop local stack
        if: always()
        run: docker compose down

  deploy:
    name: Deploy - genesis-lab
    runs-on: [self-hosted, genesis-lab]
    needs: bruno-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f backend/Dockerfile .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

      - name: Deploy container
        run: |
          cd /opt/aegis
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --force-recreate aegis-backend

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS https://aegis.byop.dev/actuator/health; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Keycloak realm hardening
        env:
          KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
          KEYCLOAK_REALM: aegis
          KEYCLOAK_WEB_CLIENT_ID: aegis-web
          KEYCLOAK_ADMIN: ${{ secrets.KEYCLOAK_ADMIN }}
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_FROM_DISPLAY_NAME: ${{ secrets.SMTP_FROM_DISPLAY_NAME }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: "true"
          SMTP_SSL: "false"
        run: bash infra/keycloak/scripts/harden-realm-prod.sh
