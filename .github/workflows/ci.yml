name: CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - release
      - main
  pull_request:
    branches:
      - develop
      - release
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: aegis-pms
  BRUNO_CLI_VERSION: "4.0.0"
  KEYCLOAK_CLI_IMAGE: quay.io/keycloak/keycloak:26.0

jobs:
  frontend-check:
    name: Frontend - typecheck + lint
    runs-on: [self-hosted, genesis-lab]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  backend-verify:
    name: Backend - Maven verify
    runs-on: [self-hosted, genesis-lab]
    env:
      AEGIS_DB_HOST: localhost
      AEGIS_DB_PORT: "5434"
      AEGIS_DB_NAME: aegis_pms
      AEGIS_DB_USER: aegis_user
      AEGIS_DB_PASSWORD: aegis_password
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis_pms
          POSTGRES_USER: aegis_user
          POSTGRES_PASSWORD: aegis_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U aegis_user -d aegis_pms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Verify
        working-directory: backend
        run: ./mvnw -B clean verify

  docker-build:
    name: Docker - build image
    runs-on: [self-hosted, genesis-lab]
    needs:
      - frontend-check
      - backend-verify
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -f backend/Dockerfile .

  # Stack EFÊMERA de CI (infra/docker-compose.ci.yml): PostgreSQL x2, Keycloak
  # (realm importado automaticamente + usuários de teste via keycloak-init-ci),
  # MailHog e Backend. Nada persiste: tmpfs + `down -v` garantido no final.
  # Jamais aponta para banco/Keycloak de produção (Oracle Cloud) — ver
  # docs/adr/ADR-0021-stack-ci-efemera.md.
  bruno-tests:
    name: Bruno - ephemeral CI stack
    runs-on: [self-hosted, genesis-lab]
    needs: docker-build
    env:
      COMPOSE_CI: docker compose -f infra/docker-compose.ci.yml --env-file infra/.env.ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node for Bruno
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Bruno runtime
        run: |
          node -e "if (!globalThis.crypto?.subtle) throw new Error('Web Crypto API unavailable')"
          npx --yes @usebruno/cli@${BRUNO_CLI_VERSION} --version

      # Pré-limpeza de infra: remove qualquer resíduo da stack de CI deixado
      # por um run anterior abortado (runner self-hosted).
      - name: Pre-clean CI stack (resíduos de runs anteriores)
        run: ${{ env.COMPOSE_CI }} down -v --remove-orphans || true

      - name: Start ephemeral CI stack
        run: ${{ env.COMPOSE_CI }} up -d --build

      - name: Wait for Keycloak bootstrap (realm + usuários de teste)
        run: |
          EXIT_CODE=$(docker wait aegis-keycloak-init-ci)
          docker logs aegis-keycloak-init-ci
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Bootstrap do Keycloak de CI falhou (exit ${EXIT_CODE})."
            ${{ env.COMPOSE_CI }} logs keycloak-ci
            exit 1
          fi

      - name: Resolve CI endpoints
        run: |
          BACKEND_ADDRESS=$(${{ env.COMPOSE_CI }} port aegis-backend-ci 8080)
          BACKEND_PORT=${BACKEND_ADDRESS##*:}
          MAILHOG_ADDRESS=$(${{ env.COMPOSE_CI }} port mailhog-ci 8025)
          MAILHOG_PORT=${MAILHOG_ADDRESS##*:}
          KEYCLOAK_ISSUER=$(grep '^KEYCLOAK_ISSUER_URI=' infra/.env.ci | cut -d= -f2-)
          if [ -z "$BACKEND_PORT" ] || [ -z "$MAILHOG_PORT" ] || [ -z "$KEYCLOAK_ISSUER" ]; then
            echo "Não foi possível resolver os endpoints efêmeros da stack de CI."
            exit 1
          fi
          echo "BRUNO_CI_BASE_URL=http://127.0.0.1:${BACKEND_PORT}" >> "$GITHUB_ENV"
          echo "BRUNO_CI_MAILHOG_BASE_URL=http://127.0.0.1:${MAILHOG_PORT}" >> "$GITHUB_ENV"
          echo "BRUNO_CI_KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER}" >> "$GITHUB_ENV"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${BRUNO_CI_BASE_URL}/actuator/health"; then
              exit 0
            fi
            sleep 5
          done
          ${{ env.COMPOSE_CI }} logs aegis-backend-ci
          exit 1

      # Credenciais do usuário de teste efêmero (criado pelo keycloak-init-ci).
      # Lidas de infra/.env.ci com grep/cut (não usar `source`: valores podem
      # conter caracteres especiais) e injetadas no Bruno via --env-var — as
      # coleções e environments permanecem intocados.
      - name: Load CI test credentials
        run: |
          echo "BRUNO_CI_USERNAME=$(grep '^CI_TEST_USERNAME=' infra/.env.ci | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "BRUNO_CI_PASSWORD=$(grep '^CI_TEST_PASSWORD=' infra/.env.ci | cut -d= -f2-)" >> "$GITHUB_ENV"

      # PRÉ-LIMPEZA: apagar resíduos de runs anteriores que falharam antes do teardown
      # (na stack efêmera isso vira no-op, mas mantém o comportamento atual)
      - name: Pre-test teardown (limpar resíduos anteriores)
        working-directory: bruno
        run: >-
          npx --yes @usebruno/cli@${BRUNO_CLI_VERSION} run 99-teardown
          --env local -r --sandbox developer
          --env-var baseUrl="$BRUNO_CI_BASE_URL"
          --env-var keycloakIssuer="$BRUNO_CI_KEYCLOAK_ISSUER"
          --env-var mailhogBaseUrl="$BRUNO_CI_MAILHOG_BASE_URL"
          --env-var username="$BRUNO_CI_USERNAME"
          --env-var password="$BRUNO_CI_PASSWORD"
        continue-on-error: true # não bloquear se já está limpo

      # SUITE PRINCIPAL: --sandbox developer é obrigatório para que o teardown
      # embutido no 99-teardown (que usa fetch() no post-response script)
      # funcione — o sandbox default "safe" (QuickJS) não tem fetch, então o
      # teardown roda sem erro aparente mas não apaga nada (G.1).
      - name: Run Bruno collection
        working-directory: bruno
        run: >-
          npx --yes @usebruno/cli@${BRUNO_CLI_VERSION} run
          --env local --sandbox developer
          --env-var baseUrl="$BRUNO_CI_BASE_URL"
          --env-var keycloakIssuer="$BRUNO_CI_KEYCLOAK_ISSUER"
          --env-var mailhogBaseUrl="$BRUNO_CI_MAILHOG_BASE_URL"
          --env-var username="$BRUNO_CI_USERNAME"
          --env-var password="$BRUNO_CI_PASSWORD"

      # PÓS-LIMPEZA: garantir limpeza mesmo que a suite falhe no meio
      - name: Post-test teardown (garantir limpeza após suite)
        if: always()
        working-directory: bruno
        run: >-
          npx --yes @usebruno/cli@${BRUNO_CLI_VERSION} run 99-teardown
          --env local -r --sandbox developer
          --env-var baseUrl="$BRUNO_CI_BASE_URL"
          --env-var keycloakIssuer="$BRUNO_CI_KEYCLOAK_ISSUER"
          --env-var mailhogBaseUrl="$BRUNO_CI_MAILHOG_BASE_URL"
          --env-var username="$BRUNO_CI_USERNAME"
          --env-var password="$BRUNO_CI_PASSWORD"

      # Destrói a stack efêmera SEMPRE (sucesso ou falha), incluindo volumes
      # anônimos (-v). Depois confirma que não ficou container nem volume.
      - name: Destroy ephemeral CI stack (down -v)
        if: always()
        run: ${{ env.COMPOSE_CI }} down -v --remove-orphans

      - name: Assert no CI residue (containers/volumes)
        if: always()
        run: |
          LEFT_CONTAINERS=$(docker ps -aq --filter "label=com.docker.compose.project=aegis-pms-ci")
          LEFT_VOLUMES=$(docker volume ls -q --filter "label=com.docker.compose.project=aegis-pms-ci")
          if [ -n "$LEFT_CONTAINERS" ] || [ -n "$LEFT_VOLUMES" ]; then
            echo "Resíduo da stack de CI detectado:"
            echo "containers: $LEFT_CONTAINERS"
            echo "volumes: $LEFT_VOLUMES"
            exit 1
          fi
          echo "OK: nenhum container ou volume da stack de CI permaneceu."

  deploy:
    name: Deploy - genesis-lab
    runs-on: [self-hosted, genesis-lab]
    needs: bruno-tests
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == (vars.AEGIS_DEPLOY_BRANCH || 'develop')
    concurrency:
      group: aegis-genesis-lab-deploy
      cancel-in-progress: false
    env:
      AEGIS_DEPLOY_BRANCH: ${{ vars.AEGIS_DEPLOY_BRANCH || 'develop' }}
      AEGIS_ENV_FILE: ${{ vars.AEGIS_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Keycloak realm hardening
        run: |
          ENV_FILE="${AEGIS_ENV_FILE:-/opt/genesis-lab/services/aegis-pms/secrets/.env.${AEGIS_DEPLOY_BRANCH}}"
          test -f "$ENV_FILE" || {
            echo "Arquivo de ambiente não encontrado: $ENV_FILE"
            exit 1
          }
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$ENV_FILE:/run/secrets/aegis.env:ro" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            "$KEYCLOAK_CLI_IMAGE" \
            infra/keycloak/scripts/harden-realm-prod.sh \
            --env-file /run/secrets/aegis.env

      - name: Build, deploy and validate
        run: ./scripts/deploy-aegis.sh
