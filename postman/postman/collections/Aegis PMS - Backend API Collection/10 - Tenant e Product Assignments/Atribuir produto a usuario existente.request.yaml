$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/users"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "tenantId": "{{tenantId}}",
      "userId": "{{userId}}",
      "role": "EDITOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('usuario atribuido', () => pm.expect(json.userSubject).to.eql(pm.collectionVariables.get('userId')));
      pm.test('status contrato', () => pm.expect(json.status).to.eql('atribuido'));
    language: text/javascript
order: 4000
