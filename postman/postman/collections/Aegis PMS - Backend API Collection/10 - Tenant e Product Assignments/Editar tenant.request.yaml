$kind: http-request
url: "{{baseUrl}}/api/v1/tenants/{{tenantId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "{{tenantName}} Atualizado",
      "plan": "PRO",
      "status": "ativo"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('tenant atualizado', () => pm.expect(json.id).to.eql(pm.collectionVariables.get('tenantId')));
      pm.test('plan presente', () => pm.expect(json.plan).to.be.a('string').and.not.empty);
    language: text/javascript
order: 1000
