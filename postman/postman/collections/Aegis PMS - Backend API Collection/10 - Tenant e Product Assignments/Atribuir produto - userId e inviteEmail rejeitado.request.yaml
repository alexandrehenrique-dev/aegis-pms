$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/users"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{productId}}",
      "tenantId": "{{tenantId}}",
      "userId": "{{userId}}",
      "inviteEmail": "{{inviteEmail}}",
      "role": "EDITOR"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      const json = pm.response.json();
      pm.test('erro de atribuicao', () => pm.expect(json.error).to.eql('INVALID_PRODUCT_ASSIGNMENT'));
    language: text/javascript
order: 6000
