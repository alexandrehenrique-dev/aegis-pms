$kind: http-request
url: "{{baseUrl}}/api/v1/tenants"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "key": "{{tenantKey}}",
      "name": "BYOP Duplicado"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      pm.test('erro presente', () => pm.expect(pm.response.json().error).to.be.a('string'));
    language: text/javascript
order: 3000
