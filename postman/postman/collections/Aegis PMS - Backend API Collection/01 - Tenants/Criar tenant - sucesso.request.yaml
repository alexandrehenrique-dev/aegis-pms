$kind: http-request
url: "{{baseUrl}}/api/v1/tenants"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "key": "{{tenantKey}}",
      "name": "BYOP"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('tenant id presente', () => pm.expect(json.id).to.be.a('string').and.not.empty);
      pm.test('tenant key preservada', () => pm.expect(json.key).to.eql(pm.collectionVariables.get('tenantKey')));
      pm.collectionVariables.set('tenantId', json.id);
    language: text/javascript
order: 1000
