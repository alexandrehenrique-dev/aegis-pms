$kind: http-request
url: "{{baseUrl}}/api/v1/products"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('body é array', () => pm.expect(pm.response.json()).to.be.an('array'));
    language: text/javascript
order: 3000
