$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/graph/nodes/{{articleNodeId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('id preservado', () => pm.expect(json.id).to.eql(pm.collectionVariables.get('articleNodeId')));
    language: text/javascript
order: 7000
