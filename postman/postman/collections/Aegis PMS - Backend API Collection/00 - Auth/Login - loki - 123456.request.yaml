$kind: http-request
name: Login - loki / 123456
url: "{{baseUrl}}/api/v1/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('accessToken presente', () => pm.expect(json.accessToken).to.be.a('string').and.not.empty);
      pm.test('refreshToken presente', () => pm.expect(json.refreshToken).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('token', json.accessToken);
      pm.collectionVariables.set('refreshToken', json.refreshToken);
    language: text/javascript
order: 1000
