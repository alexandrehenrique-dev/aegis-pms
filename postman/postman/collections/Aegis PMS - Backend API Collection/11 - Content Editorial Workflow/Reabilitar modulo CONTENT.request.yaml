$kind: http-request
description: Reabilita o modulo CONTENT, deixando o produto pronto para os demais requests da colecao.
url: "{{baseUrl}}/api/v1/products/{{productId}}/modules/CONTENT/enable"
method: POST
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: pm.test('status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 14000
