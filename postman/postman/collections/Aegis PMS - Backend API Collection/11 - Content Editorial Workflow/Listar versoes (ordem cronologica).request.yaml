$kind: http-request
description: Lista as ContentVersion do conteudo em ordem cronologica ascendente — cada transicao/publicacao gera uma versao nova.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/{{contentId}}/versions"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('lista de versoes', () => pm.expect(json).to.be.an('array'));
    language: text/javascript
order: 9000
