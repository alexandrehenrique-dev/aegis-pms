$kind: http-request
description: EDITOR pode mover conteudo até In Review, nunca publicar. Este request usa {{editorToken}} (token de um usuario com papel AEGIS_EDITOR e ProductAssignment EDITOR ativo no produto) em vez do {{token}} herdado da colecao — defina {{editorToken}} manualmente antes de rodar este request. Espera 403 CONTENT_PUBLISH_FORBIDDEN.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/{{contentId}}/publish"
method: POST
headers:
  Authorization: Bearer {{editorToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "comment": "tentativa indevida via Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 403', () => pm.response.to.have.status(403));
      const json = pm.response.json();
      pm.test('erro de publicacao proibida', () => pm.expect(json.error).to.eql('CONTENT_PUBLISH_FORBIDDEN'));
    language: text/javascript
order: 8000
