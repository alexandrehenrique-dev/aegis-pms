$kind: http-request
description: Edita titulo/corpo/metadados. O corpo inclui <script> propositalmente para provar que o backend sanitiza markdown antes de persistir (Sprint 11, MarkdownSanitizer) — a resposta nunca deve conter a tag <script>.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/{{contentId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Artigo Editado via Postman",
      "type": "article",
      "lang": "pt-BR",
      "body": "<p>Corpo seguro</p><script>alert(1)</script>",
      "summary": "Resumo via Postman",
      "difficultyLevel": "intermediate",
      "category": "categoria-postman",
      "topic": "topico-postman",
      "metadata": {
        "origin": "postman"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('script removido pela sanitizacao', () => pm.expect(json.body).to.not.include('<script>'));
    language: text/javascript
order: 4000
