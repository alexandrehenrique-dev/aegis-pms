$kind: http-request
description: Timeline de atividade editorial (texto livre), derivada das ContentVersion de todos os conteudos do produto.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/edit-events"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('lista de eventos', () => pm.expect(json).to.be.an('array'));
    language: text/javascript
order: 11000
