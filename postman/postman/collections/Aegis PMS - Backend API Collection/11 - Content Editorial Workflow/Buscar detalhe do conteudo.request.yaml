$kind: http-request
description: Detalhe de um conteudo especifico, escopado por produto.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/{{contentId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('id confere', () => pm.expect(json.id).to.eql(pm.collectionVariables.get('contentId')));
    language: text/javascript
order: 3000
