$kind: http-request
description: Atalho para transicao com destino Published — atualiza tambem o campo publication. Requer papel SUPER_ADMIN, TENANT_ADMIN ou PRODUCT_MANAGER no token {{token}}.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/{{contentId}}/publish"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "comment": "publicado via Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('status Published', () => pm.expect(json.status).to.eql('Published'));
      pm.test('publication preenchido', () => pm.expect(json.publication).to.not.eql('—'));
    language: text/javascript
order: 7000
