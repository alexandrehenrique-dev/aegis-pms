$kind: http-request
name: Transicao Draft -> In Review
description: Transicao permitida pela maquina de estados editorial (Draft -> In Review). Toda transicao grava uma nova ContentVersion.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/{{contentId}}/transition"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "from": "Draft",
      "to": "In Review",
      "comment": "pronto para revisao via Postman"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('status atualizado', () => pm.expect(json.status).to.eql('In Review'));
    language: text/javascript
order: 5000
