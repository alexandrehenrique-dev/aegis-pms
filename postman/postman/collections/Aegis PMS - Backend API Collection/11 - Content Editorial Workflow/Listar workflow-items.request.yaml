$kind: http-request
description: Estado inicial do quadro Kanban (WorkflowBoard) — um item por conteudo do produto, com status/versao atuais.
url: "{{baseUrl}}/api/v1/products/{{productId}}/content/workflow-items"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('lista de workflow items', () => pm.expect(json).to.be.an('array'));
    language: text/javascript
order: 10000
