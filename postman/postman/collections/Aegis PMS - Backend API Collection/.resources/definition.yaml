$kind: collection
description: Collection oficial e cumulativa da API backend do Aegis PMS. Reune os fluxos de autenticacao, tenants, produtos, modulos, Knowledge Graph, health/status e operacoes de atribuicao de usuarios a produtos.
variables:
  baseUrl: http://localhost:8080
  username: loki
  password: "123456"
  token: ""
  refreshToken: ""
  tenantKey: ""
  tenantId: ""
  productKey: ""
  productId: ""
  s3ProductKey: ""
  s3ProductId: ""
  articleNodeId: ""
  topicNodeId: ""
  graphEdgeId: ""
  userId: ""
  inviteEmail: guest@example.com
  tenantName: BYOP
scripts:
  - type: http:beforeRequest
    code: |-
      if (!pm.collectionVariables.get('baseUrl')) { pm.collectionVariables.set('baseUrl', 'http://localhost:8080'); }
      if (!pm.collectionVariables.get('username')) { pm.collectionVariables.set('username', 'loki'); }
      if (!pm.collectionVariables.get('password')) { pm.collectionVariables.set('password', '123456'); }
      if (!pm.collectionVariables.get('tenantKey')) { pm.collectionVariables.set('tenantKey', 'byop-' + Date.now()); }
      if (!pm.collectionVariables.get('productKey')) { pm.collectionVariables.set('productKey', 'maestro-beton-' + Date.now()); }
      if (!pm.collectionVariables.get('userId')) { pm.collectionVariables.set('userId', ''); }
      if (!pm.collectionVariables.get('inviteEmail')) { pm.collectionVariables.set('inviteEmail', 'guest-' + Date.now() + '@example.com'); }
      if (!pm.collectionVariables.get('tenantName')) { pm.collectionVariables.set('tenantName', 'BYOP'); }
    language: text/javascript
