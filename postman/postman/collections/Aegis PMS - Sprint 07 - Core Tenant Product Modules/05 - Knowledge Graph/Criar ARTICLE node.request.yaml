$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/graph/nodes"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nodeType": "ARTICLE",
      "refType": "ARTICLE",
      "refId": "article-postman-{{$timestamp}}",
      "label": "Article Knowledge Graph Postman",
      "slug": "article-knowledge-graph-postman",
      "metadataJson": "{\"source\":\"postman\"}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('ARTICLE preservado', () => pm.expect(json.nodeType).to.eql('ARTICLE'));
      pm.collectionVariables.set('articleNodeId', json.id);
    language: text/javascript
order: 1000
