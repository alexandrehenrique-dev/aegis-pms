$kind: http-request
name: Criar produto s3 - sucesso sem storage local
url: "{{baseUrl}}/api/v1/products"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenantId": "{{tenantId}}",
      "key": "s3-{{productKey}}",
      "name": "Produto S3",
      "type": "Portal",
      "defaultLocale": "pt-BR",
      "assetStorageStrategy": "S3"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.collectionVariables.set('s3ProductId', json.id);
      pm.test('assetStorageStrategy s3', () => pm.expect(String(json.assetStorageStrategy).toLowerCase()).to.eql('s3'));
    language: text/javascript
order: 2000
