$kind: http-request
url: "{{baseUrl}}/api/v1/products"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tenantId": "",
      "key": "",
      "name": "",
      "type": "",
      "defaultLocale": ""
    }
scripts:
  - type: afterResponse
    code: pm.test('status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
