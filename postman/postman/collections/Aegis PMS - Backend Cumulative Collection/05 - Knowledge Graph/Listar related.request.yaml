$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/graph/nodes/{{topicNodeId}}/related"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('resposta é array', () => pm.expect(json).to.be.an('array'));
    language: text/javascript
order: 8000
