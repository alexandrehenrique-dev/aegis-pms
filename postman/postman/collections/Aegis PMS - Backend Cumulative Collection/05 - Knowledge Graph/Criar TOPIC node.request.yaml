$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/graph/nodes"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nodeType": "TOPIC",
      "refType": "TOPIC",
      "refId": "topic-postman-{{$timestamp}}",
      "label": "Knowledge Graph Topic",
      "slug": "knowledge-graph-topic",
      "metadataJson": "{\"source\":\"postman\"}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 201', () => pm.response.to.have.status(201));
      const json = pm.response.json();
      pm.test('TOPIC preservado', () => pm.expect(json.nodeType).to.eql('TOPIC'));
      pm.collectionVariables.set('topicNodeId', json.id);
    language: text/javascript
order: 2000
