$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/modules/ECOMMERCE/disable"
method: POST
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('ECOMMERCE desabilitado', () => { pm.expect(json.moduleKey).to.eql('ECOMMERCE'); pm.expect(json.enabled).to.eql(false); });
    language: text/javascript
order: 8000
