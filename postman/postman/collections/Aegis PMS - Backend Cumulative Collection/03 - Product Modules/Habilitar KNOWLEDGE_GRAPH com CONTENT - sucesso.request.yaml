$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}/modules/KNOWLEDGE_GRAPH/enable"
method: POST
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('KNOWLEDGE_GRAPH habilitado', () => { pm.expect(json.moduleKey).to.eql('KNOWLEDGE_GRAPH'); pm.expect(json.enabled).to.eql(true); });
    language: text/javascript
order: 3000
