$kind: http-request
url: "{{baseUrl}}/api/v1/products/{{productId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('id confere', () => pm.expect(json.id).to.eql(pm.collectionVariables.get('productId')));
      pm.test('modules existe', () => pm.expect(json.modules).to.be.an('array'));
    language: text/javascript
order: 4000
