$kind: http-request
description: Valida que /actuator/health e publico e responde UP.
url: "{{baseUrl}}/actuator/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      const json = pm.response.json();
      pm.test('health UP', () => pm.expect(json.status).to.eql('UP'));
    language: text/javascript
order: 1000
