$kind: http-request
url: "{{keycloakBaseUrl}}/realms/{{realm}}/protocol/openid-connect/token"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    client_id: "{{clientId}}"
    grant_type: password
    username: "{{username}}"
    password: "{{password}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', function () { pm.response.to.have.status(200); });
      const json = pm.response.json();
      pm.test('access_token exists', function () { pm.expect(json.access_token).to.be.a('string').and.not.empty; });
      pm.collectionVariables.set('token', json.access_token);
    language: text/javascript
order: 1000
